# ============================================================================
# DIRE WOLF CONFIGURATION FOR DIGIRIG + BAOFENG (KISS OVER TCP)
# ============================================================================

# 1. AUDIO DEVICE CONFIGURATION
# Format: ADEVICE receive-device transmit-device
# Replace "plughw:1,0" with your specific Digirig hardware index if it differs.
ADEVICE plughw:1,0 plughw:1,0

# 2. CHANNEL PROPERTIES
# Standard VHF APRS runs at 1200 baud AFSK
CHANNEL 0
MODEM 1200

# 3. HARDWARE PTT VIA DIGIRIG
# Digirig triggers the Baofeng PTT by pulsing the RTS line of its built-in serial port.
# Replace /dev/ttyUSB0 with your exact Digirig serial port path if necessary.
PTT /dev/ttyUSB0 RTS

# 4. TIMING TUNING FOR BAOFENG HTs
# Baofengs switch slowly. We must pad the transmission with a longer preamble 
# (TXDELAY) so the radio has time to fully transmit before data begins.
# Values are in tens of milliseconds (30 = 300ms).
TXDELAY 30
TXTAIL 10

# 5. KISS TCP INTERFACE
# Dire Wolf exposes a KISS TNC on this TCP port. The Python app connects over
# localhost via asyncio, which gives sub-millisecond latency and real readiness
# notification (no polling, no pty/tty line-discipline overhead).
KISSPORT 8001
